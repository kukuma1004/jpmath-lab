<body>

      <a class="auth-back" href="../../index.html">JP Math Lab 으로 돌아가기</a>

  <div class="page-shell">
    <p class="breadcrumb"><a href="../../index.html">JP Math Lab</a> / <a href="../index.html">수업창고</a> / AI 킬러문제</p>

    <header class="hero">
      <div>
        <p class="eyebrow">CLASSROOM ARCHIVE · 03</p>
        <h1>AI 킬러문제 교사용</h1>
        <p class="hero-copy">풀이와 수업 노트입니다. 학생용은 풀이 없이 따로 공개하고, 답만 맞춰 볼 수 있습니다.</p>
      </div>
      <div class="folder-mark" aria-hidden="true"><span></span></div>
    </header>

    <div id="sets"></div>
  </div>

<script>
window.addEventListener('DOMContentLoaded', function(){
  'use strict';
  const sets = (window.JPKillerSolutionSets || []).slice().sort((a, b) => a.id - b.id);
  const catalog = window.JPKillerCatalog;
  const host = document.getElementById('sets');
  if (!sets.length || !catalog) { host.innerHTML = '<p>풀이를 불러오지 못했습니다.</p>'; return }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /* 카드에는 조판을 걸지 않는다. 그러니 TeX 구분기호를 떼어 내야 글로 읽힌다 —
     떼지 않으면 목록에 \(c\) 같은 것이 그대로 드러난다. */
  const strip = (s) => String(s)
    .replace(/<[^>]+>/g, '')
    .replace(/\\[()[\]]/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  const solutions = sets.flatMap((data) => data.problems.map((problem) => {
    const meta = catalog.problems.find((p) => p.setId === data.id && p.no === problem.no);
    return { data, problem, meta };
  }));

  host.innerHTML = catalog.domains.map((domain, domainIndex) => {
    const domainItems = solutions.filter((item) => item.meta && item.meta.subjectKey === 'calculus' && item.meta.domain === domain.key);
    return `
    <section class="archive-section" aria-label="미적분Ⅰ ${esc(domain.label)}">
      <div class="section-heading">
        <div>
          <p class="section-number">${String(domainIndex + 1).padStart(2, '0')}</p>
          <h2>미적분Ⅰ · ${esc(domain.label)}</h2>
        </div>
        <p>${esc(domain.caption)} · ${domainItems.length}문항</p>
      </div>
      ${catalog.difficulties.map((difficulty) => {
        const items = domainItems.filter((item) => item.meta.difficulty === difficulty.key);
        if (!items.length) return '';
        return `<div class="teacher-level-group">
          <h3>${esc(difficulty.label)} <small>${items.length}문항</small></h3>
          <ul class="resource-grid teacher-grid">
            ${items.map(({ data, problem: p, meta }) => `
              <li>
                <a class="resource-card teacher-csat" href="풀이.html?set=${data.id}&amp;no=${p.no}">
                  <div class="card-meta"><span>${esc(difficulty.label)} 풀이</span><b>${esc(meta.code)}</b></div>
                  <h3>${esc(p.title)}</h3>
                  <p>${esc(strip(p.why))}</p>
                  <div class="card-action">풀이 열기 <span>→</span></div>
                </a>
              </li>`).join('')}
          </ul>
        </div>`;
      }).join('')}
    </section>`;
  }).join('')
    + `<ul class="resource-grid teacher-grid"><li>
      <a class="resource-card teacher-csat" href="../../AI킬러문제/index.html">
        <div class="card-meta"><span>학생용 문제지</span><b>공개</b></div>
        <h3>AI 킬러문제 학생용 목록</h3>
        <p>문제와 정답 확인만 있는 공개 페이지입니다. 수업 전에 미리 풀려 보낼 때 이 주소를 주세요.</p>
        <div class="card-action">문제지 열기 <span>→</span></div>
      </a>
    </li></ul>`;
});
</script>
</body>
