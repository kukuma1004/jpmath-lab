<!DOCTYPE html>
<html lang="ko" class="classroom-auth-pending">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<title>AI 킬러문제 교사용 풀이 · 수업창고</title>
<script src="../auth.js" data-classroom-protected></script>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css"/>
<link rel="stylesheet" href="../../jp-math-typography.css?v=4"/>
<link rel="stylesheet" href="../../jp-polish.css?v=11"/>
<link rel="stylesheet" href="../../AI킬러문제/killer.css?v=1"/>
<script defer src="../../vendor/katex/katex.min.js"></script>
<script defer src="../../jp-polish.js?v=21"></script>
<script defer src="풀이.js?v=4"></script>
<script defer src="그림.js?v=1"></script>
<style>
  /* 교사용은 인쇄해서 들고 들어가는 일이 많다. */
  .why{margin:18px 0 0;padding:14px 16px;border:1px solid #fde68a;border-radius:12px;background:#fffbeb;color:#92400e;font-size:14px}
  .why b{display:block;margin-bottom:4px;font-size:12.5px;letter-spacing:.04em}
  .step{margin-top:22px}
  .step h4{margin-bottom:8px;font-size:14px;color:#6d28d9}
  .step .body{font-size:15px}
  .answer-box{display:inline-block;margin-top:22px;padding:10px 18px;border-radius:12px;background:#111827;color:#fff;font-weight:700}
  .teach{margin-top:22px;padding:16px 18px;border:1px dashed #e5e7eb;border-radius:12px;background:#fcfcfd;font-size:14.5px}
  .teach b{display:block;margin-bottom:5px;color:#b45309;font-size:12.5px;letter-spacing:.04em}
  .lock-note{display:flex;gap:10px;align-items:flex-start;margin-bottom:24px;padding:14px 16px;
    border:1px solid #fde68a;border-radius:14px;background:#fffbeb;color:#92400e;font-size:13px}
  /* 움직이는 그림. 넷은 그래프를 밀어야 보이는 문항이라 판을 하나씩 붙였다. */
  .figure{margin:22px 0 0;padding:14px 14px 8px;border:1px solid #ede9fe;border-radius:14px;background:#faf9ff}
  .fig-caption{margin:0 0 10px;color:#5b21b6;font-size:13px;line-height:1.7}
  .fig-canvas{display:block;width:100%;border:1px solid #e9e5f8;border-radius:10px;background:#fff}
  .fig-slider{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:#374151}
  .fig-slider-name{flex:0 0 auto;min-width:5.5em;font-weight:600;color:#6d28d9}
  .fig-slider input{flex:1;accent-color:#6d28d9}
  .fig-slider-val{flex:0 0 auto;min-width:4.5em;text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600}
  .fig-readout{margin:10px 0 4px;padding:8px 10px;border-radius:9px;background:#fff;border:1px solid #e9e5f8;
    font-size:13px;line-height:1.8;color:#374151}
  @media print{.lock-note,.q-nav,footer,.breadcrumb,.fig-slider{display:none}.paper{border-color:#ccc}}
</style>
</head>
<body>

<p class="breadcrumb"><a href="../index.html">수업창고</a> / <a href="index.html">AI 킬러문제</a> / <span id="crumb">풀이</span></p>

<div class="lock-note">
  <span aria-hidden="true">⚠</span>
  <div>수업창고 자료입니다. 학생에게 이 주소를 주지 마세요 — 학생용은 <a href="../../AI킬러문제/index.html">AI 킬러문제 목록</a>입니다.</div>
</div>

<nav class="q-nav">
  <a id="prev" href="#">← 이전 문항</a>
  <a href="index.html">목록</a>
  <a id="next" href="#">다음 문항 →</a>
</nav>

<main id="paper"></main>

<footer>
  <p>문항의 수학은 조건이 서로 어긋나지 않는지, 답이 하나로 정해지는지까지 수치로 확인했습니다.</p>
</footer>

<script>
window.addEventListener('DOMContentLoaded', function(){
  'use strict';
  const data = window.JPKillerSolutions;
  const paper = document.getElementById('paper');
  if (!data) { paper.innerHTML = '<p class="empty">풀이를 불러오지 못했습니다.</p>'; return }

  const want = Number(new URLSearchParams(location.search).get('no')) || 1;
  const item = data.problems.find((p) => p.no === want) || data.problems[0];
  const index = data.problems.indexOf(item);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  document.title = `KILLER ${String(item.no).padStart(2, '0')} 풀이 · ${item.title} · 수업창고`;
  document.getElementById('crumb').textContent = `KILLER ${String(item.no).padStart(2, '0')} 풀이`;

  const link = (el, at) => {
    const to = data.problems[at];
    if (to) { el.href = `풀이.html?no=${to.no}`; el.removeAttribute('aria-disabled') }
    else { el.href = '#'; el.setAttribute('aria-disabled', 'true') }
  };
  link(document.getElementById('prev'), index - 1);
  link(document.getElementById('next'), index + 1);

  paper.innerHTML = `
    <article class="paper">
      <div class="head">
        <span class="no">KILLER ${String(item.no).padStart(2, '0')} · ${esc(data.subject)}</span>
        <span class="level hard">교사용</span>
      </div>
      <h1>${esc(item.title)}</h1>

      <div class="stem">
        <p>${item.stem}</p>
        <div class="cond">${item.conds.map((c) => `<p>${c}</p>`).join('')}</div>
        <p class="ask">${item.ask}</p>
      </div>

      <div class="why"><b>왜 어려운가</b>${item.why}</div>

      ${item.figure ? '<div class="figure" data-figure="' + esc(item.figure) + '"></div>' : ''}

      ${item.steps.map((s) => `
        <div class="step">
          <h4>${esc(s.head)}</h4>
          <div class="body">${s.body}</div>
        </div>`).join('')}

      <p><span class="answer-box">답 ${esc(item.answer)}</span></p>

      <div class="teach"><b>수업에서 짚을 곳</b>${item.note}</div>
    </article>`;

  /* innerHTML 을 한 번 거치면 TeX 안의 & 가 &amp; 로 바뀐다. cases 나 array 는
     & 로 칸을 나누므로 그대로 넘기면 정렬이 깨진다. 되돌려서 넘긴다. */
  const unescape = (tex) => tex
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, String.fromCharCode(34)).replace(/&amp;/g, '&');

  function typeset() {
    if (!window.katex) return;
    paper.querySelectorAll('.stem, .ask, .why, .step .body, .teach').forEach((el) => {
      el.innerHTML = el.innerHTML
        .replace(/\\\[([\s\S]+?)\\\]/g, (m, tex) => {
          try { return window.katex.renderToString(unescape(tex), { throwOnError: false, displayMode: true }) } catch (e) { return m }
        })
        .replace(/\\\(([\s\S]+?)\\\)/g, (m, tex) => {
          try { return window.katex.renderToString(unescape(tex), { throwOnError: false }) } catch (e) { return m }
        });
    });
  }
  if (window.katex) typeset();
  else window.addEventListener('load', typeset);

  /* 그림은 조판과 무관하므로 따로 올린다. 그림.js 가 없어도 풀이는 읽힌다. */
  const slot = paper.querySelector('[data-figure]');
  if (slot) {
    const put = () => window.JPKillerFigures && window.JPKillerFigures.mount(slot, slot.dataset.figure);
    if (window.JPKillerFigures) put(); else window.addEventListener('load', put);
  }
});
</script>
</body>
</html>
