<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Math Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', sans-serif;
    background-color: #f9fafb;
    color: #111827;
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 20px;
  }
  
  .hero { margin-bottom: 40px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: #6b7280;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .hero h1 { font-size: 42px; font-weight: 800; margin-bottom: 12px; }
  .lede { font-size: 16px; color: #4b5563; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
    list-style: none;
    margin-top: 40px;
  }

  .card {
    display: flex;
    flex-direction: column;
    aspect-ratio: 1 / 1;
    border-radius: 28px;
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    padding: 28px 24px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.06);
  }

  .code-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
    background: rgba(0,0,0,0.04);
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-block;
    align-self: flex-start;
    margin-bottom: 24px;
  }

  .card-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  .card-desc { font-size: 14px; color: #6b7280; line-height: 1.55; word-break: keep-all; }
  .card-footer { margin-top: auto; display: flex; justify-content: flex-end; }
  .card-arrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }
</style>
</head>
<body>

  <header class="hero">
    <p class="eyebrow">MATH VISUALIZATION</p>
    <h1>JP Math Lab</h1>
    <p class="lede">수학의 개념을 직접 조작하며 시각적으로 이해하는 인터랙티브 학습 공간입니다.</p>
  </header>

  <ul class="grid">
    <!-- 추후 추가될 과목들 예시 -->
    <li>
      <a class="card" style="--accent:#4F46E5" href="#">
        <span class="code-chip">MATH Ⅰ</span>
        <h2 class="card-title">수학Ⅰ</h2>
        <p class="card-desc">지수·로그함수, 삼각함수, 그리고 수열의 기초 개념을 다룹니다.</p>
        <div class="card-footer"><span class="card-arrow">준비 중...</span></div>
      </a>
    </li>
    
    <li>
      <a class="card" style="--accent:#059669" href="#">
        <span class="code-chip">MATH Ⅱ</span>
        <h2 class="card-title">수학Ⅱ</h2>
        <p class="card-desc">함수의 극한과 연속, 다항함수의 미분과 적분을 학습합니다.</p>
        <div class="card-footer"><span class="card-arrow">준비 중...</span></div>
      </a>
    </li>

    <!-- 미적분1 링크 연결 -->
    <li>
      <a class="card" style="--accent:#C1442D" href="미적분1.html">
        <span class="code-chip">CALC Ⅰ</span>
        <h2 class="card-title">미적분Ⅰ</h2>
        <p class="card-desc">극한에서 접선의 방정식까지, 그래프를 직접 움직이며 확인해 보세요.</p>
        <div class="card-footer"><span class="card-arrow">입장하기 →</span></div>
      </a>
    </li>
  </ul>

</body>
</html>
