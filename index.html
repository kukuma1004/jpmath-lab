<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학Ⅱ 실험실 모음</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Pretendard", -apple-system, sans-serif; max-width: 500px; margin: 0 auto; padding: 40px 20px; background: #f8fafc; color: #1e293b; }
    h1 { font-size: 1.8rem; color: #1e3a8a; text-align: center; margin-bottom: 8px; }
    p { text-align: center; color: #64748b; margin-top: 0; font-size: 0.95rem; }
    .list { display: grid; gap: 12px; margin-top: 28px; }
    .card { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; text-decoration: none; color: #0f172a; font-weight: bold; font-size: 1.05rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.2s; }
    .card:hover { border-color: #2563eb; background: #eff6ff; color: #2563eb; transform: translateY(-2px); }
    .arrow { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h1>📐 수학Ⅱ 실험실</h1>
  <p>원하는 탐구 주제를 선택해 보세요.</p>

  <div class="list">
    <!-- 사진속 실제 파일명: 극한탐정v2.html -->

      <span>🔎 극한 탐정 v2</span>
      <span class="arrow">입장하기 →</span>
    </a>

    <!-- 사진속 실제 파일명: 미적분1_극한.html -->
    <a href="미적분1_극한.html" class="card">
      <span>📊 미적분Ⅰ - 극한</span>
      <span class="arrow">입장하기 →</span>
    </a>

    <!-- 사진속 실제 파일명: 미적분1_연속.html -->
    <a href="미적분1_연속.html" class="card">
      <span>📈 미적분Ⅰ - 연속</span>
      <span class="arrow">입장하기 →</span>
    </a>

    <!-- 사진속 실제 파일명: 연속 탐정v2.html (띄어쓰기 포함) -->
    <a href="연속 탐정v2.html" class="card">
      <span>🔍 연속 탐정 v2</span>
      <span class="arrow">입장하기 →</span>
    </a>
  </div>

</body>
</html>
