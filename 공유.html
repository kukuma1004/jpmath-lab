<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR로 들어오기 · JP Math Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600;700&amp;family=Noto+Serif+KR:wght@700;900&amp;display=swap" rel="stylesheet">
<script src="vendor/qr.js?v=1"></script>
<style>
:root{--ink:#17231d;--muted:#616a66;--paper:#f4f0e6;--white:#fffdf7;--line:#d8d2c5;--green:#1f6b50;--green-light:#dce9df}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(244,240,230,.96);position:sticky;top:0;z-index:5}
.bar a.back{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--ink);border-radius:9px;background:var(--white);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}
.bar h1{flex:1;margin:0;font:900 17px/1.2 "Noto Serif KR",serif;letter-spacing:-.04em}
.bar button{padding:9px 14px;border:1px solid var(--ink);border-radius:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}

.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
.stage{display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 24px;border-radius:20px;background:var(--white);border:1px solid var(--line);text-align:center}
.qbox{width:min(72vw,360px);aspect-ratio:1/1;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.warn{margin:10px auto 0;max-width:34ch;padding:10px 12px;border-radius:10px;background:#fff4e5;color:#9a4b09;font-size:13px;line-height:1.6}
.qbox svg{width:100%;height:100%;display:block}
.stage h2{margin:0;font:900 27px/1.25 "Noto Serif KR",serif;letter-spacing:-.04em}
.stage .desc{margin:0;color:var(--muted);font-size:14px;line-height:1.75}
.addr{width:100%;padding:14px 16px;border-radius:12px;background:var(--paper);border:1px solid var(--line);
  font:700 15px/1.5 "IBM Plex Mono",monospace;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.acts button{padding:13px 20px;border:1px solid var(--ink);border-radius:11px;background:var(--white);font-size:14px;font-weight:700}
.acts button.primary{background:var(--ink);color:#fff}
.copied{margin:0;padding:10px 14px;border-radius:10px;background:var(--green-light);color:var(--green);font-size:13px;font-weight:700}
.hint{margin:16px 0 0;color:var(--muted);font-size:12.5px;line-height:1.8;text-align:center}

/* 전자칠판용 — 화면 가득 */
.full{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.full .fq{width:min(70vh,70vw);aspect-ratio:1/1}
.full .fq svg{width:100%;height:100%;display:block}
.full .furl{font:700 clamp(15px,2.4vw,30px) "IBM Plex Mono",monospace;word-break:break-all;text-align:center;max-width:92vw}
.full .ftitle{font:900 clamp(22px,3.6vw,44px) "Noto Serif KR",serif;letter-spacing:-.04em}
.full .close{position:absolute;top:18px;right:18px;padding:11px 16px;border:1px solid var(--ink);border-radius:10px;background:var(--white);font-size:14px;font-weight:700}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="./">← JP Math Lab</a>
  <h1>QR로 들어오기</h1>
  <button data-full>전자칠판에 크게</button>
</div>

<div class="wrap" data-site="https://kukuma1004.github.io/jpmath-lab/">
  <section class="stage">
    <div class="qbox" data-qr></div>
    <h2>JP Math Lab</h2>
    <p class="desc">휴대폰 카메라로 이 QR을 비추면 바로 들어옵니다.<br>주소를 칠 필요가 없습니다.</p>
    <div class="addr" data-url>—</div>
    <p class="warn hidden" data-warn></p>
    <div class="acts">
      <button class="primary" data-copy>주소 복사</button>
      <button data-share hidden>공유하기</button>
      <button data-full2>크게 보기</button>
    </div>
    <p class="copied hidden" data-copied>복사했습니다.</p>
  </section>

  <p class="hint">전자칠판에 띄워 학생이 찍게 하거나, 학생끼리 서로 화면을 보여 줘도 됩니다.<br>
  <span data-hint></span></p>
</div>

<div class="full hidden" data-fullscreen>
  <button class="close" data-close>닫기</button>
  <div class="ftitle">JP Math Lab</div>
  <div class="fq" data-fq></div>
  <div class="furl" data-furl></div>
</div>

<script>
/* 어느 주소를 QR 에 담을지 고른다.

   원칙은 그대로다 — 이 페이지가 있는 곳이 곧 사이트 뿌리이므로 주소를 코드에
   박지 않는다. (파일 이름이 한글이라 location.href 는 퍼센트 인코딩으로
   나오므로 경로에서 파일명만 뗀다.)

   다만 지금 열려 있는 주소가 폰에서 열리지 않는 경우가 있다. 파일을
   더블클릭해서 열면 location.origin 이 "null" 이라 QR 에
   null/C:/Users/... 가 담기고, 카메라로 찍어도 아무 데도 못 간다 —
   실제로 이것 때문에 "QR 이 안 들어가진다" 는 말을 들었다. 로컬 서버
   (127.0.0.1)도 남의 폰에서는 열리지 않기는 마찬가지다.

   그럴 때만 배포 주소(wrap 의 data-site)를 대신 담고, 그 사실을 화면에
   적어 준다. 박아 두는 주소는 그 한 곳뿐이다. */
const $ = s => document.querySelector(s);
const SITE = $('[data-site]').dataset.site;
const here = location.origin + location.pathname.replace(/[^/]*$/, '');
const PRIVATE = /^(localhost|127\.|0\.0\.0\.0|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/;
const reachable = /^https?:$/.test(location.protocol) && !PRIVATE.test(location.hostname);
const HOME = reachable ? here : SITE;

function draw(el) {
  try { el.innerHTML = JPQR.svg(HOME, { margin: 4, dark: '#17231d', light: '#ffffff' }); }
  catch (e) { el.innerHTML = '<p style="padding:14px;font-size:13px;color:#9f4320">QR을 만들지 못했습니다. 아래 주소를 직접 쳐 주세요.</p>'; }
}

$('[data-url]').textContent = decodeURIComponent(HOME);
$('[data-furl]').textContent = decodeURIComponent(HOME);
draw($('[data-qr]'));

/* 지금 주소가 아니라 배포 주소를 담았으면 반드시 알린다.
   모르고 그대로 띄우면 학생이 찍어도 아무 데도 못 간다. */
if (!reachable) {
  const w = $('[data-warn]');
  w.textContent = location.protocol === 'file:'
    ? '이 파일을 직접 열어서, QR 에는 인터넷 주소를 대신 담았습니다. 학생에게 나눠 줄 때는 그대로 쓰셔도 됩니다.'
    : '지금 주소는 이 컴퓨터 안에서만 열립니다. QR 에는 인터넷 주소를 대신 담았습니다.';
  w.classList.remove('hidden');
}

// 주소가 길면 QR 이 촘촘해진다. 짧은 도메인을 붙이면 굵어진다는 걸 알려 준다.
try {
  const m = JPQR.matrix(HOME);
  $('[data-hint]').textContent = `QR ${m.length}×${m.length}칸 · 주소 ${decodeURIComponent(HOME).length}자.`
    + (m.length >= 33 ? ' 짧은 도메인을 붙이면 QR 이 더 굵어져 뒷자리에서도 잘 찍힙니다.' : '');
} catch (e) {}

$('[data-copy]').onclick = async () => {
  const text = decodeURIComponent(HOME);
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    // 클립보드가 막힌 브라우저에서는 선택만 해 준다
    const r = document.createRange(); r.selectNodeContents($('[data-url]'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  const c = $('[data-copied]'); c.classList.remove('hidden');
  setTimeout(() => c.classList.add('hidden'), 1800);
};

if (navigator.share) {
  const sb = $('[data-share]'); sb.hidden = false;
  sb.onclick = () => navigator.share({ title: 'JP Math Lab', url: HOME }).catch(() => {});
}

function openFull() {
  draw($('[data-fq]'));
  $('[data-fullscreen]').classList.remove('hidden');
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
function closeFull() {
  $('[data-fullscreen]').classList.add('hidden');
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
$('[data-full]').onclick = openFull;
$('[data-full2]').onclick = openFull;
$('[data-close]').onclick = closeFull;
addEventListener('keydown', e => { if (e.key === 'Escape') closeFull(); });
</script>
</body>
</html>
