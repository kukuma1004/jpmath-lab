<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@700;900&amp;display=swap" rel="stylesheet">
  <style>
    :root{--ink:#142321;--muted:#687773;--paper:#f0f1eb;--surface:#fbfcf7;--line:#d7ddd7;--night:#0d2925;--green:#176b5b;--green-soft:#dcece6;--orange:#d3663b;--orange-soft:#f5dfd3;--red:#ad332e;--red-soft:#fff0ef;--yellow:#f3c861;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans KR',sans-serif;--serif:'Noto Serif KR',serif;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans)}body::before{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(13,41,37,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(13,41,37,.035) 1px,transparent 1px);background-size:32px 32px;content:''}button,input,textarea,select{font:inherit}.shell{width:min(1420px,calc(100% - 36px));margin:auto;padding:24px 0 70px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.brand b{display:grid;width:42px;height:42px;place-items:center;border-radius:13px;color:#fff;background:var(--night);font:700 13px var(--mono)}.brand strong{display:block}.brand small{color:var(--muted);font:700 8px var(--mono);letter-spacing:.13em}.live{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.8);color:var(--muted);font-size:11px}.live i{width:9px;height:9px;border-radius:50%;background:#4fc29b;box-shadow:0 0 0 6px rgba(79,194,155,.1);animation:pulse 2s infinite}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:end;padding:clamp(34px,5vw,62px);border-radius:28px;color:#fff;background:radial-gradient(circle at 88% 0,rgba(211,102,59,.35),transparent 30%),var(--night)}.hero p{margin:0;color:#82d6bf;font:700 10px var(--mono);letter-spacing:.14em}.hero h1{margin:12px 0 0;font:900 clamp(40px,5vw,70px)/1.06 var(--serif);letter-spacing:-.06em}.hero-copy{max-width:590px;color:#c7d9d4;font-size:14px;line-height:1.75}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0 36px}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.82)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:8px;font:700 30px var(--mono)}.stat.attention{color:var(--red);border-color:#edc2bf;background:var(--red-soft)}
    .tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.search{flex:1;min-width:230px}.search input,.tools select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 13px;outline:0}.search input:focus,.tools select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,107,91,.12)}.tools select{width:auto;min-width:150px}.layout{display:grid;grid-template-columns:minmax(320px,.72fr) minmax(0,1.28fr);gap:12px}.list,.detail{min-height:700px;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.list-head{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.response-list{max-height:760px;overflow:auto;padding:7px}.item{display:grid;grid-template-columns:42px 1fr auto;width:100%;gap:11px;align-items:center;padding:13px 10px;border:0;border-bottom:1px solid #e8ece7;border-radius:11px;color:var(--ink);background:transparent;text-align:left;cursor:pointer;transition:.18s}.item:hover,.item.active{background:var(--green-soft);transform:translateX(2px)}.item.attention{border:1px solid #efc3c0;background:var(--red-soft)}.avatar{display:grid;width:42px;height:42px;place-items:center;border-radius:12px;color:var(--green);background:#fff;font-weight:800}.item.attention .avatar{color:#fff;background:var(--red)}.item strong,.item small{display:block}.item strong{margin-top:3px;font-size:14px}.item small{margin-top:4px;color:var(--muted);font-size:11px}.badge{padding:6px 8px;border-radius:999px;color:#8b4a2f;background:var(--orange-soft);font:700 8px var(--mono);white-space:nowrap}.badge.red{color:#fff;background:var(--red)}.badge.green{color:#fff;background:var(--green)}.empty{display:grid;min-height:620px;place-items:center;align-content:center;padding:30px;text-align:center}.empty b{font:900 25px var(--serif)}.empty p{max-width:360px;color:var(--muted);font-size:13px;line-height:1.7}.detail{padding:clamp(24px,4vw,42px)}.detail.flash{animation:flash 1.2s ease}.detail-top{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.detail h2{margin:20px 0 8px;font:900 clamp(32px,4vw,48px)/1.15 var(--serif);letter-spacing:-.05em}.question{margin:0;color:#40514d;font-size:18px;line-height:1.7}.warning{margin:20px 0;padding:16px;border:1px solid #e8aaa6;border-radius:14px;color:#8f2e29;background:var(--red-soft)}.warning strong,.warning span{display:block}.warning span{margin-top:5px;font-size:13px;line-height:1.6}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.answer{padding:16px;border:1px solid var(--line);border-radius:14px;background:#f4f5f0}.answer strong{display:block;color:var(--green);font-size:11px}.answer p{margin:8px 0 0;white-space:pre-wrap;color:#475752;font-size:13px;line-height:1.72}.review{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}.review h3{margin:0 0 14px;font-size:15px}.review-grid{display:grid;grid-template-columns:180px 1fr;gap:9px}.review select,.review textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px;outline:0}.review textarea{min-height:110px;resize:vertical;line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{min-height:42px;padding:0 13px;border:0;border-radius:10px;color:#fff;background:var(--green);font-weight:800;cursor:pointer}.actions button.revise{background:var(--orange)}.actions button.reject{background:var(--red)}.actions button.wait{color:var(--green);background:var(--green-soft)}.actions button:disabled{opacity:.5}.toast{position:fixed;right:18px;bottom:18px;z-index:10;max-width:380px;padding:14px 16px;border-radius:13px;color:#fff;background:var(--night);box-shadow:0 18px 50px rgba(0,0,0,.2);opacity:0;transform:translateY(12px);transition:.25s var(--ease)}.toast.show{opacity:1;transform:none}.toast.error{background:var(--red)}
    @keyframes pulse{50%{box-shadow:0 0 0 11px rgba(79,194,155,0)}}@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 5px rgba(243,200,97,.5)}}@media(max-width:900px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.list,.detail{min-height:0}.response-list{max-height:430px}.answers{grid-template-columns:1fr}}@media(max-width:560px){.shell{width:min(100% - 20px,1420px)}.topbar{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.review-grid{grid-template-columns:1fr}.hero{padding:30px 24px}.detail{padding:22px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><b>JP</b><div><strong>주제탐구 실시간 운영실</strong><small>PRIVATE TEACHER DASHBOARD</small></div></div><div class="live"><i></i><span id="syncText">Sheet 연결 준비 중</span></div></header>
    <section class="hero"><div><p>교사용 실시간 검토</p><h1>학생의 수정이<br>바로 도착합니다.</h1></div><div class="hero-copy">학생 제출과 수정 내용을 8초마다 확인합니다. 과목이 애매하거나 선택 과목과 내용이 어긋난 응답은 빨간색으로 먼저 보여 줍니다.</div></section>
    <section class="stats"><article class="stat"><span>전체 응답</span><strong id="total">—</strong></article><article class="stat"><span>검토 대기</span><strong id="waiting">—</strong></article><article class="stat attention"><span>과목 확인 필요</span><strong id="subjectReview">—</strong></article><article class="stat"><span>승인</span><strong id="approved">—</strong></article></section>
    <div class="tools"><label class="search"><input id="search" type="search" placeholder="학생 이름·질문·개념 검색"></label><select id="subjectFilter" aria-label="과목 필터"><option value="all">모든 과목</option><option value="미적분Ⅰ">미적분Ⅰ</option><option value="기하">기하</option><option value="경제수학">경제수학</option><option value="attention">과목 확인 필요</option></select><select id="statusFilter" aria-label="상태 필터"><option value="all">모든 상태</option><option value="검토 대기">검토 대기</option><option value="재검토 대기">재검토 대기</option><option value="보완 필요">보완 필요</option><option value="반려">반려</option><option value="승인">승인</option></select></div>
    <section class="layout"><aside class="list"><div class="list-head"><strong id="count">0개 응답</strong><span>선택해 검토하세요</span></div><div class="response-list" id="responseList"></div></aside><article class="detail" id="detail"><div class="empty"><b>응답을 선택해 주세요.</b><p>학생 원문, 과목 확인 표시, 수정 횟수와 교사 피드백을 한 화면에서 확인합니다.</p></div></article></section>
  </main><div class="toast" id="toast" role="status"></div>
  <script>
    (function(){'use strict';var state={token:'',items:[],selectedId:'',query:'',subject:'all',status:'all',signature:'',loading:false};var byId=function(id){return document.getElementById(id)};
      google.script.url.getLocation(function(location){state.token=location.parameter.token||'';bind();refresh(false);window.setInterval(function(){if(!document.hidden)refresh(true)},8000)});
      function bind(){byId('search').addEventListener('input',function(){state.query=this.value.trim().toLowerCase();drawList()});byId('subjectFilter').addEventListener('change',function(){state.subject=this.value;drawList()});byId('statusFilter').addEventListener('change',function(){state.status=this.value;drawList()});document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh(true)})}
      function refresh(quiet){if(state.loading)return;state.loading=true;if(!quiet)byId('syncText').textContent='Sheet에서 불러오는 중…';google.script.run.withSuccessHandler(function(result){state.loading=false;if(!result||!result.ok){byId('syncText').textContent='연결 확인 필요';return toast(result?result.message:'자료를 불러오지 못했습니다.',true)}var signature=JSON.stringify(result.items.map(function(item){return[item.id,item.updatedAt,item.reviewStatus,item.teacherFeedback,item.subject]}));var changed=state.signature&&state.signature!==signature;state.signature=signature;state.items=result.items||[];byId('syncText').textContent='마지막 동기화 '+result.syncedAt;drawStats(result.stats);if(!state.selectedId&&state.items.length)state.selectedId=state.items[0].id;drawList();drawDetail(state.items.find(function(item){return item.id===state.selectedId}));if(changed){byId('detail').classList.remove('flash');void byId('detail').offsetWidth;byId('detail').classList.add('flash');toast('학생 응답의 새 변경사항을 반영했습니다.')}}).withFailureHandler(function(){state.loading=false;byId('syncText').textContent='연결 확인 필요';toast('Sheet 연결 중 문제가 발생했습니다.',true)}).getTeacherDashboard(state.token)}
      function drawStats(stats){['total','waiting','subjectReview','approved'].forEach(function(key){byId(key).textContent=stats[key]})}
      function filtered(){return state.items.filter(function(item){if(state.subject==='attention'&&!item.needsSubjectReview)return false;if(state.subject!=='all'&&state.subject!=='attention'&&item.subject!==state.subject)return false;if(state.status!=='all'&&item.reviewStatus!==state.status)return false;if(!state.query)return true;return[item.name,item.subject,item.concept,item.curiosity,item.reason].join(' ').toLowerCase().indexOf(state.query)!==-1})}
      function drawList(){var list=byId('responseList'),items=filtered();byId('count').textContent=items.length+'개 응답';list.textContent='';if(!items.length){list.innerHTML='<div class="empty"><p>조건에 맞는 응답이 없습니다.</p></div>';return}items.forEach(function(item){var button=document.createElement('button');button.type='button';button.className='item'+(item.id===state.selectedId?' active':'')+(item.needsSubjectReview?' attention':'');var avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=item.name.slice(-2);var copy=document.createElement('span');copy.innerHTML='<small></small><strong></strong><small></small>';copy.children[0].textContent=item.subject+' · '+item.name;copy.children[1].textContent=item.curiosity||item.concept;copy.children[2].textContent=(item.revisionCount?'수정 '+item.revisionCount+'회 · ':'')+item.updatedAt;var badge=document.createElement('span');badge.className='badge'+(item.needsSubjectReview?' red':item.reviewStatus==='승인'?' green':'');badge.textContent=item.needsSubjectReview?'과목 확인':item.reviewStatus;button.appendChild(avatar);button.appendChild(copy);button.appendChild(badge);button.addEventListener('click',function(){state.selectedId=item.id;drawList();drawDetail(item)});list.appendChild(button)})}
      function addAnswer(wrap,title,text){var box=document.createElement('div');box.className='answer';var strong=document.createElement('strong');strong.textContent=title;var p=document.createElement('p');p.textContent=text||'—';box.appendChild(strong);box.appendChild(p);wrap.appendChild(box)}
      function drawDetail(item){var panel=byId('detail');if(!item){panel.innerHTML='<div class="empty"><b>응답을 선택해 주세요.</b></div>';return}panel.textContent='';var top=document.createElement('div');top.className='detail-top';top.innerHTML='<span class="badge"></span><span class="badge"></span><small></small>';top.children[0].textContent=item.reviewStatus;top.children[1].textContent=item.subject;top.children[2].textContent='수정 '+item.revisionCount+'회 · '+item.updatedAt;panel.appendChild(top);var h=document.createElement('h2');h.textContent=item.name+' 학생';panel.appendChild(h);var q=document.createElement('p');q.className='question';q.textContent='“'+item.curiosity+'”';panel.appendChild(q);if(item.needsSubjectReview){var warning=document.createElement('div');warning.className='warning';warning.innerHTML='<strong>과목 확인 필요</strong><span></span>';warning.querySelector('span').textContent=item.subjectReason||'학생과 과목을 다시 확인해 주세요.';panel.appendChild(warning)}var answers=document.createElement('div');answers.className='answers';addAnswer(answers,'관심 개념',item.concept);addAnswer(answers,'선정 이유',item.reason);addAnswer(answers,'탐구 방법',item.method);addAnswer(answers,'웹앱 아이디어',item.appIdea);if(item.studentNote)addAnswer(answers,'학생 메모',item.studentNote);panel.appendChild(answers);var review=document.createElement('section');review.className='review';review.innerHTML='<h3>교사 검토와 되돌려쓰기</h3><div class="review-grid"><select id="reviewSubject"><option>미적분Ⅰ</option><option>기하</option><option>경제수학</option><option>과목 확인 필요</option></select><textarea id="feedback" placeholder="보완할 점이나 다시 생각할 질문을 학생에게 적어 주세요."></textarea></div><div class="actions"><button data-status="승인">승인</button><button class="revise" data-status="보완 필요">보완 필요</button><button class="reject" data-status="반려">반려</button><button class="wait" data-status="검토 대기">검토 대기</button></div>';panel.appendChild(review);byId('reviewSubject').value=item.subject;byId('feedback').value=item.teacherFeedback||'';Array.prototype.forEach.call(review.querySelectorAll('[data-status]'),function(button){button.addEventListener('click',function(){saveReview(item,this.getAttribute('data-status'),review)})})}
      function saveReview(item,status,review){var buttons=review.querySelectorAll('button'),feedback=byId('feedback').value.trim(),subject=byId('reviewSubject').value;if((status==='보완 필요'||status==='반려')&&feedback.length<2)return toast('학생이 고칠 수 있도록 피드백을 입력해 주세요.',true);Array.prototype.forEach.call(buttons,function(button){button.disabled=true});google.script.run.withSuccessHandler(function(result){Array.prototype.forEach.call(buttons,function(button){button.disabled=false});if(!result||!result.ok)return toast(result?result.message:'저장하지 못했습니다.',true);toast(result.message);refresh(true)}).withFailureHandler(function(){Array.prototype.forEach.call(buttons,function(button){button.disabled=false});toast('검토 상태를 저장하지 못했습니다.',true)}).reviewIntake(state.token,{submissionId:item.id,status:status,feedback:feedback,subject:subject})}
      function toast(message,error){var node=byId('toast');node.textContent=message;node.className='toast show'+(error?' error':'');window.clearTimeout(toast.timer);toast.timer=window.setTimeout(function(){node.classList.remove('show')},3000)}
    }());
  </script>
</body>
</html>
