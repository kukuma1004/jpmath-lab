<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@700;900&amp;display=swap" rel="stylesheet">
  <style>
    :root { --ink:#102522; --muted:#63726f; --paper:#f4f2ea; --green:#176b5b; --orange:#d2683c; --line:#d9ddd6; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 88% 8%,rgba(23,107,91,.16),transparent 28%),radial-gradient(circle at 8% 78%,rgba(210,104,60,.15),transparent 28%),var(--paper); font-family:'IBM Plex Sans KR',sans-serif; }
    button,input,textarea { font:inherit; }
    .shell { width:min(920px,calc(100% - 28px)); margin:auto; padding:44px 0 90px; }
    .header { display:flex; justify-content:space-between; gap:20px; margin-bottom:46px; padding-bottom:20px; border-bottom:1px solid var(--line); }
    .brand { font-weight:800; letter-spacing:-.03em; }
    .edition { color:var(--muted); font-size:12px; }
    .hero { display:grid; grid-template-columns:1fr auto; gap:32px; align-items:center; margin-bottom:34px; }
    .eyebrow { margin:0 0 12px; color:var(--green); font-size:11px; font-weight:800; letter-spacing:.13em; }
    h1 { margin:0; font:900 clamp(44px,8vw,78px)/1.08 'Noto Serif KR',serif; letter-spacing:-.065em; }
    .hero-mark { display:grid; width:150px; aspect-ratio:1; place-items:center; border:1px solid rgba(23,107,91,.28); border-radius:50%; color:white; background:var(--green); font:900 72px 'Noto Serif KR',serif; box-shadow:24px 24px 0 rgba(210,104,60,.14); }
    .panel { padding:clamp(24px,5vw,46px); border:1px solid var(--line); border-radius:28px; background:rgba(255,255,255,.84); box-shadow:0 24px 60px rgba(28,46,42,.08); }
    .lookup { display:grid; grid-template-columns:1fr auto; gap:10px; margin-top:24px; }
    label { display:block; margin-bottom:8px; font-size:13px; font-weight:800; }
    input,textarea { width:100%; border:1px solid var(--line); border-radius:14px; background:white; color:var(--ink); outline:none; }
    input { min-height:52px; padding:0 16px; text-transform:uppercase; letter-spacing:.11em; }
    textarea { min-height:140px; padding:15px 16px; resize:vertical; line-height:1.7; }
    input:focus,textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(23,107,91,.1); }
    button { min-height:52px; padding:0 20px; border:0; border-radius:14px; color:white; background:var(--green); cursor:pointer; font-weight:800; }
    button:hover { filter:brightness(.94); }
    button:disabled { opacity:.45; cursor:wait; }
    .message { min-height:24px; margin:12px 0 0; color:var(--orange); font-size:13px; }
    .workspace[hidden],.success[hidden] { display:none; }
    .student-heading { display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:18px; margin-bottom:24px; }
    .student-heading h2 { margin:0; font:900 34px 'Noto Serif KR',serif; letter-spacing:-.045em; }
    .student-heading p { margin:0; color:var(--muted); }
    .inquiry-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
    .inquiry-tab { min-height:40px; padding:0 14px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:white; font-size:13px; }
    .inquiry-tab.is-active { border-color:var(--green); color:white; background:var(--green); }
    .topic-card { margin-bottom:26px; padding:24px; border-radius:20px; color:white; background:linear-gradient(135deg,#0f4d43,var(--green)); }
    .topic-card span { color:#bce1d8; font-size:12px; font-weight:700; }
    .topic-card h3 { margin:8px 0 10px; font-size:28px; letter-spacing:-.04em; }
    .topic-card p { margin:0; color:#e2f0ec; line-height:1.65; }
    .prompt-field { margin-top:22px; }
    .prompt-number { display:inline-grid; width:28px; height:28px; margin-right:7px; place-items:center; border-radius:50%; color:white; background:var(--orange); font-size:12px; }
    .optional { margin-top:34px; padding-top:28px; border-top:1px solid var(--line); }
    .submit-row { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:28px; }
    .privacy { color:var(--muted); font-size:12px; line-height:1.55; }
    .success { text-align:center; }
    .success strong { display:block; margin-bottom:12px; color:var(--green); font:900 42px 'Noto Serif KR',serif; }
    .success p { color:var(--muted); line-height:1.7; }
    .secondary { margin-top:18px; border:1px solid var(--line); color:var(--green); background:white; }
    @media (max-width:640px) { .hero{grid-template-columns:1fr}.hero-mark{display:none}.lookup{grid-template-columns:1fr}.submit-row{align-items:stretch;flex-direction:column}.submit-row button{width:100%}.header{margin-bottom:34px} }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header"><span class="brand">JP Math Lab</span><span class="edition">2026 수학 주제탐구</span></header>
    <section class="hero">
      <div><p class="eyebrow">학생 질문함</p><h1>질문을 다듬고,<br>탐구를 시작합니다.</h1></div>
      <div class="hero-mark" aria-hidden="true">?</div>
    </section>

    <section class="panel" id="loginPanel">
      <p>선생님께 받은 학생 코드를 입력하면 나의 탐구 주제와 이번 발문을 확인할 수 있습니다.</p>
      <div class="lookup">
        <div><label for="studentCode">학생 코드</label><input id="studentCode" maxlength="12" autocomplete="off" placeholder="예: A1B2C3"></div>
        <button type="button" id="lookupButton">내 발문 확인</button>
      </div>
      <p class="message" id="loginMessage" role="alert"></p>
    </section>

    <section class="panel workspace" id="workspace" hidden>
      <div class="student-heading"><div><p class="eyebrow">나의 탐구</p><h2 id="studentName"></h2></div><p>답변은 선생님에게만 전달됩니다.</p></div>
      <div class="inquiry-tabs" id="inquiryTabs"></div>
      <div class="topic-card"><span id="subject"></span><h3 id="topicTitle"></h3><p id="currentQuestion"></p></div>
      <form id="responseForm">
        <div id="promptFields"></div>
        <div class="optional">
          <div class="prompt-field"><label for="newQuestion">답하면서 새롭게 생긴 질문</label><textarea id="newQuestion" placeholder="아직 없다면 비워 두어도 됩니다."></textarea></div>
          <div class="prompt-field"><label for="studentNote">선생님께 전하고 싶은 말</label><textarea id="studentNote" placeholder="어려웠던 점이나 도움이 필요한 부분을 적어 주세요."></textarea></div>
        </div>
        <div class="submit-row"><span class="privacy">답변은 기존 기록을 덮어쓰지 않고 제출할 때마다 새 기록으로 보관됩니다.</span><button type="submit" id="submitButton">답변 제출하기</button></div>
        <p class="message" id="submitMessage" role="alert"></p>
      </form>
    </section>

    <section class="panel success" id="successPanel" hidden>
      <strong>제출 완료</strong><p id="successMessage"></p><button type="button" class="secondary" id="continueButton">다른 탐구 답변하기</button>
    </section>
  </main>

  <script>
    (function () {
      'use strict';
      var state = { studentCode: '', inquiries: [], selectedIndex: 0 };
      var byId = function (id) { return document.getElementById(id); };

      byId('studentCode').addEventListener('input', function () { this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
      byId('studentCode').addEventListener('keydown', function (event) { if (event.key === 'Enter') lookup(); });
      byId('lookupButton').addEventListener('click', lookup);
      byId('responseForm').addEventListener('submit', submit);
      byId('continueButton').addEventListener('click', function () { byId('successPanel').hidden = true; byId('workspace').hidden = false; });

      function lookup() {
        var code = byId('studentCode').value.trim();
        if (!code) return showMessage('loginMessage', '학생 코드를 입력해 주세요.');
        setBusy('lookupButton', true, '확인 중…');
        showMessage('loginMessage', '');
        google.script.run.withSuccessHandler(function (result) {
          setBusy('lookupButton', false, '내 발문 확인');
          if (!result || !result.ok) return showMessage('loginMessage', result ? result.message : '발문을 불러오지 못했습니다.');
          state.studentCode = result.student.code;
          state.inquiries = result.inquiries;
          state.selectedIndex = 0;
          byId('studentName').textContent = result.student.name + ' 학생';
          byId('loginPanel').hidden = true;
          byId('workspace').hidden = false;
          drawTabs();
          drawInquiry();
        }).withFailureHandler(function () {
          setBusy('lookupButton', false, '내 발문 확인');
          showMessage('loginMessage', '연결 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        }).getStudentWorkspace(code);
      }

      function drawTabs() {
        var tabs = byId('inquiryTabs');
        tabs.textContent = '';
        state.inquiries.forEach(function (item, index) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'inquiry-tab' + (index === state.selectedIndex ? ' is-active' : '');
          button.textContent = item.subject + ' · ' + item.title;
          button.addEventListener('click', function () { state.selectedIndex = index; drawTabs(); drawInquiry(); });
          tabs.appendChild(button);
        });
      }

      function drawInquiry() {
        var item = state.inquiries[state.selectedIndex];
        byId('subject').textContent = item.subject + ' · 발문 ' + item.promptVersion + '차';
        byId('topicTitle').textContent = item.title;
        byId('currentQuestion').textContent = '“' + item.question + '”';
        var fields = byId('promptFields');
        fields.textContent = '';
        item.prompts.forEach(function (prompt, index) {
          var wrap = document.createElement('div');
          wrap.className = 'prompt-field';
          var label = document.createElement('label');
          label.htmlFor = 'answer' + index;
          var number = document.createElement('span');
          number.className = 'prompt-number';
          number.textContent = index + 1;
          label.appendChild(number);
          label.appendChild(document.createTextNode(prompt));
          var area = document.createElement('textarea');
          area.id = 'answer' + index;
          area.required = true;
          area.placeholder = '내 생각과 그 근거를 함께 적어 보세요.';
          wrap.appendChild(label);
          wrap.appendChild(area);
          fields.appendChild(wrap);
        });
        byId('newQuestion').value = '';
        byId('studentNote').value = '';
        showMessage('submitMessage', '');
      }

      function submit(event) {
        event.preventDefault();
        var item = state.inquiries[state.selectedIndex];
        var answers = [0, 1, 2].map(function (index) { return byId('answer' + index).value.trim(); });
        if (answers.some(function (answer) { return answer.length < 2; })) return showMessage('submitMessage', '세 발문에 대한 답변을 모두 작성해 주세요.');
        setBusy('submitButton', true, '제출 중…');
        showMessage('submitMessage', '');
        google.script.run.withSuccessHandler(function (result) {
          setBusy('submitButton', false, '답변 제출하기');
          if (!result || !result.ok) return showMessage('submitMessage', result ? result.message : '답변을 저장하지 못했습니다.');
          byId('workspace').hidden = true;
          byId('successPanel').hidden = false;
          byId('successMessage').textContent = item.title + ' 답변이 저장되었습니다. 선생님의 다음 발문을 기다려 주세요.';
        }).withFailureHandler(function () {
          setBusy('submitButton', false, '답변 제출하기');
          showMessage('submitMessage', '연결 중 문제가 발생했습니다. 작성한 답변을 보존하고 다시 시도해 주세요.');
        }).submitStudentResponse({
          studentCode: state.studentCode,
          inquiryId: item.id,
          answers: answers,
          newQuestion: byId('newQuestion').value,
          studentNote: byId('studentNote').value
        });
      }

      function setBusy(id, busy, label) { var button = byId(id); button.disabled = busy; button.textContent = label; }
      function showMessage(id, message) { byId(id).textContent = message; }
    }());
  </script>
</body>
</html>
