<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기하 원리 탭 내용 점검</title>
<style>
 body{font:14px/1.6 system-ui,sans-serif;margin:20px;background:#111;color:#eee}
 table{border-collapse:collapse;width:100%;font-size:12.5px}
 td,th{border:1px solid #333;padding:4px 8px;text-align:left}
 .ok{color:#8f8}.bad{color:#f88;font-weight:700}
 iframe{width:1280px;height:900px;border:0;position:absolute;left:-9999px}
</style>
</head>
<body>
<h1>기하 원리 탭 · 내용 보강 점검</h1>
<p id="status">준비 중…</p>
<table id="out"><thead><tr>
<th>단원</th><th>섹션</th><th>핵심 흐름</th><th>오해 카드</th><th>KaTeX</th><th>오류</th>
</tr></thead><tbody></tbody></table>
<script>
const PAGES=['기하_타원.html','기하_쌍곡선.html','기하_이차곡선의접선.html',
 '기하_삼수선정리.html','기하_정사영.html','기하_공간좌표와내분점.html','기하_구의방정식.html',
 '기하_위치벡터와성분.html','기하_벡터의내적.html','기하_벡터로표현한직선.html',
 '기하_벡터로표현한평면과구.html'];
const tbody=document.querySelector('#out tbody'), status=document.getElementById('status');
let i=0, bad=0;
function step(){
  if(i>=PAGES.length){
    status.textContent='완료 — '+PAGES.length+'개 중 문제 '+bad+'개';
    status.className=bad?'bad':'ok'; return;
  }
  const page='기하/'+PAGES[i++];
  status.textContent='검사 중 ('+i+'/'+PAGES.length+')';
  const f=document.createElement('iframe');
  f.src=page+'?cacheBust='+Date.now();
  document.body.appendChild(f);
  const errs=[];
  f.onload=function(){
    try{ f.contentWindow.addEventListener('error',e=>errs.push(e.message)); }catch(e){}
    setTimeout(function(){
      let sec=0,flow=0,misc=0,katex=0,kerr=0,raw=0,note='';
      try{
        const d=f.contentDocument;
        const theory=d.querySelector('[data-page="theory"]');
        sec=theory?theory.querySelectorAll('.section').length:0;
        flow=theory?theory.querySelectorAll('.flow-steps li').length:0;
        misc=theory?theory.querySelectorAll('.misconception').length:0;
        katex=theory?theory.querySelectorAll('.katex').length:0;
        kerr=theory?theory.querySelectorAll('.katex-error').length:0;
        // 조판되지 않고 남은 날 TeX
        raw=theory&&/\\\(/.test(theory.textContent)?1:0;
      }catch(e){ note='접근 실패'; }
      const problem = sec<4 || flow===0 || misc<2 || kerr>0 || raw>0 || errs.length>0 || note;
      if(problem) bad++;
      const tr=document.createElement('tr');
      tr.innerHTML='<td>'+PAGES[i-1].replace('기하_','').replace('.html','')+'</td>'+
        '<td class="'+(sec>=4?'ok':'bad')+'">'+sec+'</td>'+
        '<td class="'+(flow?'ok':'bad')+'">'+flow+'</td>'+
        '<td class="'+(misc>=2?'ok':'bad')+'">'+misc+'</td>'+
        '<td>'+katex+'</td>'+
        '<td class="'+(kerr||raw||errs.length||note?'bad':'ok')+'">'+
          (kerr?'KaTeX오류'+kerr+' ':'')+(raw?'날TeX남음 ':'')+
          (errs.join(' ')||'')+(note||'')+
          (!kerr&&!raw&&!errs.length&&!note?'없음':'')+'</td>';
      tbody.appendChild(tr); f.remove(); step();
    }, 1200);
  };
  f.onerror=function(){ f.remove(); step(); };
}
step();
</script>
</body>
</html>
